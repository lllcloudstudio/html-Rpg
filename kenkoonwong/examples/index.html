<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic R Plot Display</title>
</head>
<body>

    <h1>My Dynamic R Dashboard</h1>

    <!— The browser loads the PNG directly from the API endpoint —>
    <img 
        id="r-plot" 
        src="http://127.0.0.1:8000/vector-plot?values=10,25,8,44,30&title=Live%20API%20Data" 
        alt="R Generated Plot"
    />





<div>
    <label for="dataInput">Enter Numbers (comma-separated):</label>
    <input type="text" id="dataInput" value="12,45,23,67,89">
    
    <label for="titleInput">Plot Title:</label>
    <input type="text" id="titleInput" value="User Trend">
    
    <button onclick="updatePlot()">Update Chart</button>
</div>

<!— The image placeholder —>
<img id="dynamicPlot" src="" alt="Click update to load chart">

<script>
function updatePlot() {
    // 1. Get values from HTML input fields
    const rawValues = document.getElementById("dataInput").value;
    const rawTitle = document.getElementById("titleInput").value;

    // 2. Safely encode the parameters for the URL
    const encodedValues = encodeURIComponent(rawValues);
    const encodedTitle = encodeURIComponent(rawTitle);

    // 3. Build the full Plumber API URL
    const apiBaseUrl = "http://127.0.0.1:8000/vector-plot";
    //const finalUrl = "${encodedValues}&title=${encodedTitle}";
    const finalUrl = "http://127.0.0.1:8000/vector-plot?values=${encodedValues}&title=${encodedTitle}";

    // 4. Update the img src attribute to force the browser to fetch the new image
    document.getElementById("dynamicPlot").src = finalUrl;
}

// Optional: Load the plot automatically when the page first loads
window.onload = updatePlot;
</script>
</body>
</html>
